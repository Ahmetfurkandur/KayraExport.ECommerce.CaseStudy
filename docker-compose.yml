# =============================================================================
# Docker Compose - Backend Microservices
# =============================================================================
# 12-Factor App Principles:
#   III.  Config       → Tüm konfigürasyon .env dosyasından okunur (env_file)
#   IV.   Backing Svcs → DB, Redis, RabbitMQ bağımsız servisler olarak tanımlanmış
#   VI.   Processes    → Her servis stateless; state Redis/DB'de tutulur
#   VII.  Port Binding → Her servis kendi portunu açar
#   XI.   Logs         → Tüm loglar stdout'a yönlendirilir, Seq'e iletilir
#
# SOLID Principles:
#   SRP → Her servis tek bir sorumluluğa sahiptir
#   OCP → Yeni servis eklemek mevcut servisleri değiştirmez
#   DIP → Servisler birbirinin implementasyonuna değil, kontrat/port'a bağımlıdır
#
# Kullanım:
#   cp .env.example .env   # .env dosyasını oluştur ve değerleri doldur
#   docker compose up -d
# =============================================================================

version: "3.9"

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  backend_net:
    driver: bridge
  gateway_net:
    driver: bridge

# =============================================================================
# VOLUMES — Kalıcı veri saklayan servisler için named volume kullanılır
# =============================================================================
volumes:
  sqlserver_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  seq_data:
    driver: local

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # API GATEWAY — YARP
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: /api-gateways/Gateway/Gateway.API/Dockerfile
    image: ${REGISTRY:-local}/api-gateway:${IMAGE_TAG:-latest}
    container_name: api-gateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${GATEWAY_HTTP_PORT}:8080"
      - "${GATEWAY_HTTPS_PORT}:8081"
    environment:
      # Container ağı içi sabit adresler .env'e taşınmaz
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address=http://auth-service:8080
      - ReverseProxy__Clusters__product-cluster__Destinations__destination1__Address=http://product-service:8080
      - ReverseProxy__Clusters__log-cluster__Destinations__destination1__Address=http://log-service:8080
      - Seq__ServerUrl=http://seq:5341
    networks:
      - backend_net
      - gateway_net
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      log-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # AUTH MICROSERVICE
  # ---------------------------------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: /src/AuthService/AuthService.API/Dockerfile
    image: ${REGISTRY:-local}/auth-service:${IMAGE_TAG:-latest}
    container_name: auth-service
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=AuthDb;User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True
    networks:
      - backend_net
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # PRODUCT MICROSERVICE
  # ---------------------------------------------------------------------------
  product-service:
    build:
      context: .
      dockerfile: /src/ProductService/ProductService.API/Dockerfile
    image: ${REGISTRY:-local}/product-service:${IMAGE_TAG:-latest}
    container_name: product-service
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ProductDb;User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD},ssl=False,abortConnect=False
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
    networks:
      - backend_net
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # LOG MICROSERVICE
  # ---------------------------------------------------------------------------
  log-service:
    build:
      context: .
      dockerfile: /src/LogService/LogService.API/Dockerfile
    image: ${REGISTRY:-local}/log-service:${IMAGE_TAG:-latest}
    container_name: log-service
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=LogDb;User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - Seq__ServerUrl=http://seq:5341
    networks:
      - backend_net
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ===========================================================================
  # BACKING SERVICES (12FA IV)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # SQL SERVER
  # ---------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD}
      - MSSQL_PID=${MSSQL_PID}
      - MSSQL_MEMORY_LIMIT_MB=${MSSQL_MEMORY_LIMIT}
    # Geliştirme ortamında dışarıdan erişim için açılabilir:
    # TODO: Prod ortamına geçmeden önce bu konfigürasyonu kapat.
    ports:
      - "${SQL_PORT}:1433"
    expose:
      - "1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./scripts/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SQL_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # ---------------------------------------------------------------------------
  # REDIS
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    env_file:
      - .env
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAX_MEMORY}
      --maxmemory-policy allkeys-lru
      --save 60 1
      --save 300 10
      --appendonly yes
    expose:
      - "6379"
    # ports:
    #   - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # RABBITMQ
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST}
    expose:
      - "5672"
    ports:
      - "${RABBITMQ_MGMT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./scripts/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # SEQ — Structured Log Aggregator (12FA XI)
  # ---------------------------------------------------------------------------
  seq:
    image: datalust/seq:latest
    container_name: seq
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD}
    ports:
      - "${SEQ_UI_PORT}:80"
    expose:
      - "5341"
    volumes:
      - seq_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s